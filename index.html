<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22282C">
<title>Libro de apuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E2DA;--paper-2:#EDEBE4;--card:#F6F5F1;
  --ink:#22282C;--ink-soft:#5C6469;--rule:#C6C2B6;--rule-hard:#9EA093;
  --loss:#9E3826;--gain:#2C6455;--caution:#96651A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:80px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(158,160,147,.13) 31px 32px)}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
header{padding:22px 0 14px;border-bottom:2px solid var(--ink);display:flex;
  align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:"IBM Plex Serif",serif;font-size:25px;letter-spacing:-.02em}
.folio{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft)}
nav{display:flex;border-bottom:1px solid var(--rule-hard);position:sticky;top:0;
  background:var(--paper);z-index:20}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;
  font:600 12px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-soft);padding:14px 2px;cursor:pointer;font-family:inherit}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
section[hidden]{display:none}
section{padding:18px 0 30px}
h2{font-family:"IBM Plex Serif",serif;font-size:18px;margin-bottom:3px}
.lede{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;display:block}
.card{background:var(--card);border:1px solid var(--rule);padding:14px;margin-bottom:12px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:14px}
.fig{background:var(--card);padding:12px 13px}
.fig .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft)}
.fig .v{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;
  letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.neg{color:var(--loss)}.pos{color:var(--gain)}
table{width:100%;border-collapse:collapse}
th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);text-align:right;padding:5px 0;
  border-bottom:1px solid var(--rule-hard);font-weight:500}
th:first-child{text-align:left}
td{padding:8px 0;border-bottom:1px solid var(--rule);text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px}
td:first-child{text-align:left;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:14px}
tr:last-child td{border-bottom:0}
label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--rule-hard);background:#FCFBF8;
  font:400 15px/1.3 "IBM Plex Sans Condensed",sans-serif;color:var(--ink);border-radius:0}
input[inputmode=decimal]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px}
.row{display:grid;gap:10px;margin-bottom:11px}
.row.c2{grid-template-columns:1fr 1fr}
button.act{width:100%;padding:13px;background:var(--ink);color:var(--paper-2);border:0;cursor:pointer;
  font:600 12px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.11em;text-transform:uppercase}
button.act:disabled{background:var(--rule-hard);cursor:not-allowed}
button.ghost{width:100%;padding:11px;background:none;color:var(--ink);
  border:1px dashed var(--rule-hard);cursor:pointer;
  font:600 11.5px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}
button.tiny{background:none;border:1px solid var(--rule-hard);padding:5px 8px;cursor:pointer;
  font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink-soft)}
button.tiny.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.tiny.win.on{background:var(--gain);color:#fff;border-color:var(--gain)}
button.tiny.lose.on{background:var(--loss);color:#fff;border-color:var(--loss)}
button.tiny.half.on{background:var(--caution);color:#fff;border-color:var(--caution)}
.x{background:none;border:0;color:var(--ink-soft);cursor:pointer;font-size:17px;padding:0 3px}
.collapse{border:1px solid var(--ink);background:var(--paper-2);padding:13px;margin:14px 0}
.collapse .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.collapse .pct{font-family:"IBM Plex Mono",monospace;font-size:29px;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:2px;height:26px;align-items:flex-end}
.bar{flex:1;background:var(--rule-hard);position:relative;transition:height .35s cubic-bezier(.4,0,.2,1)}
.bar span{position:absolute;bottom:-15px;left:0;right:0;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:8.5px;color:var(--ink-soft)}
.collapse .note{margin-top:24px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.collapse .note strong{color:var(--ink)}
.leg{border-left:3px solid var(--rule-hard);padding:11px 0 11px 11px;margin-bottom:11px}
.leg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.leg-n{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--ink-soft)}
.bet{background:var(--card);border:1px solid var(--rule);border-left-width:4px;padding:12px;margin-bottom:10px}
.bet.ganada{border-left-color:var(--gain)}
.bet.perdida{border-left-color:var(--loss)}
.bet.pendiente{border-left-color:var(--caution)}
.bet-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.bet-meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-soft);text-transform:uppercase}
.bet-amt{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sel{padding:7px 0;border-top:1px solid var(--rule)}
.sel-row{display:flex;justify-content:space-between;align-items:center;gap:9px}
.sel-txt{font-size:13.5px;line-height:1.3}
.sel-txt em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft)}
.odd{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.marks{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.verdict{border-top:2px solid var(--ink);padding-top:12px;margin-top:14px;font-size:13.5px;line-height:1.55}
.flag{border-left:3px solid var(--caution);padding-left:11px;margin:12px 0;
  font-size:13px;line-height:1.5;color:var(--ink-soft)}
.flag strong{color:var(--ink)}
.empty{text-align:center;padding:34px 16px;color:var(--ink-soft);font-size:14px;line-height:1.6}
.center{max-width:400px;margin:50px auto;padding:0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);
  color:var(--paper-2);padding:11px 20px;font:500 13px "IBM Plex Sans Condensed",sans-serif;z-index:60}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="center">Cargando…</div></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN — cambia estas dos líneas por tus valores
//  Los encuentras en Supabase → Project Settings → API
// ═══════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://TUPROYECTO.supabase.co'
const SUPABASE_ANON_KEY = 'PEGA_AQUI_TU_ANON_KEY'
// ═══════════════════════════════════════════════════════════════════

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

/* ---------- estado ---------- */
let sesion = null, casas = [], apuestas = [], tab = 'resumen'
let legs = [{ partido:'', mercado:'', cuota:'', mi_prob:'', cierre:'' }]
let form = { fecha: new Date().toISOString().slice(0,10), casa_id:'', stake:'' }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id)
const money = v => (v<0?'-':'')+'L'+Math.abs(v||0).toFixed(2)
const pct = v => (v==null||isNaN(v)) ? '—' : (v*100).toFixed(1)+'%'
const sig = v => v<0?'neg':v>0?'pos':''
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2300)}

/* Multiplicador de cada selección. Así se manejan anuladas y medias. */
function mult(s){
  const c = Number(s.cuota)
  switch(s.estado){
    case 'ganada':        return c
    case 'perdida':       return 0
    case 'anulada':       return 1
    case 'media_ganada':  return (c+1)/2
    case 'media_perdida': return 0.5
    default:              return null   // pendiente
  }
}
const cuotaTotal = sel => sel.reduce((a,s)=>a*(Number(s.cuota)||1),1)
function estado(sel){
  if(!sel.length) return 'pendiente'
  if(sel.some(s=>s.estado==='pendiente')) return 'pendiente'
  return sel.some(s=>mult(s)===0) ? 'perdida' : 'ganada'
}
function resultado(a){
  const sel = a.selecciones||[]
  if(estado(sel)==='pendiente') return 0
  const m = sel.reduce((x,s)=>x*mult(s),1)
  return Number(a.stake)*(m-1)
}
const probComb = sel => { const t=cuotaTotal(sel); return t>1?1/t:0 }
const edge = (p,c) => p - (c>1?1/c:0)
function kelly(p,c){ const e=edge(p,c); return (e<=0||c<=1)?0:Math.min((e/(c-1))*0.25,0.03) }
function filtro(p,c){
  if(!(c>1)||!(p>0)) return null
  if(c<1.5||c>5) return {ok:false,txt:'Cuota fuera del rango 1.50–5.00'}
  const e=edge(p,c)
  if(e<0.04) return {ok:false,txt:`Edge insuficiente (${(e*100).toFixed(1)}%, mínimo 4%)`}
  if(e>0.15) return {ok:false,txt:`Edge del ${(e*100).toFixed(1)}% — revisa tu análisis, no la cuota`}
  return {ok:true,txt:`Apostable · edge ${(e*100).toFixed(1)}%`}
}

function resumen(){
  const con = apuestas.map(a=>({...a,_e:estado(a.selecciones||[]),_r:resultado(a)}))
  const res = con.filter(a=>a._e!=='pendiente')
  const gan = res.filter(a=>a._r>0)
  const apostado = res.reduce((s,a)=>s+Number(a.stake),0)
  const neto = con.reduce((s,a)=>s+a._r,0)
  const inicial = casas.reduce((s,c)=>s+Number(c.saldo_inicial||0),0)
  const clvs = apuestas.flatMap(a=>a.selecciones||[])
    .filter(s=>s.cuota_cierre>1).map(s=>s.cuota/s.cuota_cierre-1)
  const tipo = parlay => {
    const g = res.filter(a=>((a.selecciones||[]).length>1)===parlay)
    return { n:g.length, neto:g.reduce((s,a)=>s+a._r,0),
             acierto:g.length?g.filter(a=>a._r>0).length/g.length:null }
  }
  return { con,inicial, banca:inicial+neto, neto, apostado,
    resueltas:res.length, acierto:res.length?gan.length/res.length:null,
    yield:apostado?neto/apostado:null,
    clvMedio:clvs.length?clvs.reduce((a,b)=>a+b,0)/clvs.length:null,
    clvPos:clvs.length?clvs.filter(v=>v>0).length/clvs.length:null, clvN:clvs.length,
    simples:tipo(false), parlays:tipo(true),
    porCasa:casas.map(c=>{
      const n=con.filter(a=>a.casa_id===c.id).reduce((s,a)=>s+a._r,0)
      return {...c,neto:n,saldo:Number(c.saldo_inicial||0)+n}
    })
  }
}

/* ---------- datos ---------- */
async function cargar(){
  const [c,a] = await Promise.all([
    sb.from('casas').select('*').order('creado_en'),
    sb.from('apuestas').select('*, selecciones(*)')
      .order('fecha',{ascending:false}).order('creado_en',{ascending:false})
  ])
  if(c.error||a.error){ toast('No se pudieron cargar los datos'); return }
  casas = c.data||[]
  apuestas = (a.data||[]).map(x=>({...x,selecciones:(x.selecciones||[]).sort((p,q)=>p.orden-q.orden)}))
  if(!form.casa_id && casas[0]) form.casa_id = casas[0].id
  render()
}

/* ---------- vistas ---------- */
function vAuth(){
  return `<div class="center">
    <h1 style="margin-bottom:6px">Libro de apuestas</h1>
    <p class="lede">Tus datos quedan atados a tu cuenta y se sincronizan entre teléfono y computadora.</p>
    <div class="row"><div>
      <label for="email">Correo</label>
      <input id="email" type="email" placeholder="tu@correo.com" autocomplete="email">
    </div></div>
    <button class="act" id="btn-login">Enviar enlace de acceso</button>
    <p class="lede" style="margin-top:14px">Te llega un enlace al correo. No hay contraseñas.</p>
  </div>`
}

function vResumen(r){
  const figs = [
    ['Banca actual',money(r.banca),sig(r.banca-r.inicial)],
    ['Resultado neto',money(r.neto),sig(r.neto)],
    ['Total apostado',money(r.apostado),''],
    ['Rendimiento',pct(r.yield),r.yield==null?'':sig(r.yield)],
    ['Resueltas',String(r.resueltas),''],
    ['Acierto',pct(r.acierto),'']
  ]
  let diag=''
  if(r.resueltas>0){
    diag = r.resueltas<100
      ? `${r.resueltas} de 100 apuestas. Todavía no hay muestra para saber si tienes ventaja — ni para bien ni para mal.`
      : r.clvMedio==null ? 'Sin cuotas de cierre no se puede medir si le ganas al mercado. Apúntalas.'
      : r.clvMedio>0&&r.neto>0 ? 'CLV positivo y ganando. El método funciona.'
      : r.clvMedio>0 ? 'CLV positivo pero perdiendo dinero. Es varianza normal: mantén el método.'
      : r.neto>0 ? 'Ganando con CLV negativo. Es suerte y va a revertir. Revisa el método.'
      : 'CLV negativo y perdiendo. No hay ventaja demostrada. Toca parar o cambiar de enfoque.'
  }
  return `<section>
    <div class="figs">${figs.map(([k,v,c])=>
      `<div class="fig"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join('')}</div>
    <div class="card"><span class="eyebrow">Por casa</span><table><tbody>
      <tr><th>Casa</th><th>Neto</th><th>Saldo</th></tr>
      ${r.porCasa.map(c=>`<tr><td>${esc(c.nombre)}</td>
        <td class="${sig(c.neto)}">${money(c.neto)}</td><td>${money(c.saldo)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><span class="eyebrow">Simples contra combinadas</span><table><tbody>
      <tr><th>Tipo</th><th>Nº</th><th>Acierto</th><th>Neto</th></tr>
      <tr><td>Simples</td><td>${r.simples.n}</td><td>${pct(r.simples.acierto)}</td>
        <td class="${sig(r.simples.neto)}">${money(r.simples.neto)}</td></tr>
      <tr><td>Combinadas</td><td>${r.parlays.n}</td><td>${pct(r.parlays.acierto)}</td>
        <td class="${sig(r.parlays.neto)}">${money(r.parlays.neto)}</td></tr>
    </tbody></table></div>
    <div class="card"><span class="eyebrow">CLV — la métrica que importa</span>
      <p class="lede" style="margin-bottom:10px">Compara la cuota que tomaste con la de cierre.
        Predice tu rentabilidad futura mejor que ganar o perder.</p>
      <table><tbody>
        <tr><td>Selecciones con cierre</td><td>${r.clvN}</td></tr>
        <tr><td>CLV medio</td><td class="${r.clvMedio==null?'':sig(r.clvMedio)}">${pct(r.clvMedio)}</td></tr>
        <tr><td>Porcentaje positivo</td><td>${pct(r.clvPos)}</td></tr>
      </tbody></table></div>
    ${diag?`<div class="verdict">${diag}</div>`:''}
    ${r.parlays.n>=5&&r.parlays.neto<r.simples.neto?
      `<div class="flag"><strong>Las combinadas te están costando dinero.</strong>
       ${money(r.parlays.neto)} frente a ${money(r.simples.neto)} en simples. Cada selección extra
       multiplica el margen de la casa, no solo la cuota.</div>`:''}
    ${r.inicial>0&&r.neto<-r.inicial*0.25?
      `<div class="flag"><strong>Has perdido más de una cuarta parte de la banca.</strong>
       Toca parar y revisar, no subir montos. El dinero perdido no vuelve con la siguiente apuesta.</div>`:''}
  </section>`
}

function vNueva(r){
  const sel = legs.map(l=>({cuota:Number(l.cuota)})).filter(s=>s.cuota>1)
  const total = cuotaTotal(sel), prob = probComb(sel)
  const acum=[]; let p=1; sel.forEach(s=>{p*=1/s.cuota;acum.push(p)})
  const simple = legs.length===1 && Number(legs[0].cuota)>1 && Number(legs[0].mi_prob)>0
  const mp = simple?Number(legs[0].mi_prob)/100:0
  const f = simple?filtro(mp,Number(legs[0].cuota)):null
  const k = simple?kelly(mp,Number(legs[0].cuota)):0

  return `<section>
    <h2>Registrar apuesta</h2>
    <p class="lede">Anota todas, incluidas las de impulso. Un registro incompleto te dirá que vas mejor de lo que vas.</p>
    <div class="card">
      <div class="row c2">
        <div><label for="f-fecha">Fecha</label>
          <input id="f-fecha" type="date" value="${form.fecha}"></div>
        <div><label for="f-casa">Casa</label><select id="f-casa">
          ${casas.map(c=>`<option value="${c.id}" ${c.id===form.casa_id?'selected':''}>${esc(c.nombre)}</option>`).join('')}
        </select></div>
      </div>
      <div class="row"><div><label for="f-stake">Monto apostado (L)</label>
        <input id="f-stake" inputmode="decimal" value="${esc(form.stake)}" placeholder="0.00"></div></div>
    </div>
    <span class="eyebrow">Selecciones</span>
    <div class="card">
      ${legs.map((l,i)=>`<div class="leg">
        <div class="leg-head"><span class="leg-n">SELECCIÓN ${i+1}</span>
        ${legs.length>1?`<button class="x" data-del="${i}" aria-label="Quitar selección ${i+1}">×</button>`:''}</div>
        <div class="row"><div><label for="lp${i}">Partido</label>
          <input id="lp${i}" data-leg="${i}" data-k="partido" value="${esc(l.partido)}" placeholder="Celtic vs LASK"></div></div>
        <div class="row c2">
          <div><label for="lm${i}">Mercado</label>
            <input id="lm${i}" data-leg="${i}" data-k="mercado" value="${esc(l.mercado)}" placeholder="Más de 2.5"></div>
          <div><label for="lc${i}">Cuota</label>
            <input id="lc${i}" data-leg="${i}" data-k="cuota" inputmode="decimal" value="${esc(l.cuota)}" placeholder="1.85"></div>
        </div>
        <div class="row c2">
          <div><label for="lx${i}">Tu probabilidad %</label>
            <input id="lx${i}" data-leg="${i}" data-k="mi_prob" inputmode="decimal" value="${esc(l.mi_prob)}" placeholder="42"></div>
          <div><label for="ly${i}">Cuota de cierre</label>
            <input id="ly${i}" data-leg="${i}" data-k="cierre" inputmode="decimal" value="${esc(l.cierre)}" placeholder="opcional"></div>
        </div>
      </div>`).join('')}
      <button class="ghost" id="btn-add-leg">+ Añadir selección</button>
    </div>
    <div class="collapse">${sel.length===0
      ? `<div class="note" style="margin-top:0">Escribe las cuotas y aquí verás la probabilidad de que <strong>todas</strong> se cumplan.</div>`
      : `<div class="top"><span class="eyebrow" style="margin:0">Probabilidad combinada</span>
           <span class="pct">${(prob*100).toFixed(1)}%</span></div>
         <div class="bars">${acum.map((v,i)=>
           `<div class="bar" style="height:${Math.max(v*100,3)}%"><span>${i+1}</span></div>`).join('')}</div>
         <div class="note">${sel.length===1
           ? `Selección simple. Cuota <strong>${total.toFixed(2)}</strong>.`
           : `<strong>${sel.length} selecciones.</strong> Cuota combinada ${total.toFixed(2)}.
              Fallar una sola lo pierde todo, y cada selección extra suma el margen de la casa otra vez.`}</div>`}
    </div>
    ${f?`<div class="flag"><strong>${f.ok?'Pasa los filtros.':'No pasa los filtros.'}</strong> ${f.txt}
      ${f.ok&&r.banca>0?` · Stake sugerido (¼ Kelly): <strong>L${(r.banca*k).toFixed(2)}</strong>`:''}</div>`:''}
    <button class="act" id="btn-guardar">Guardar en el libro</button>
  </section>`
}

const ESTADOS = [
  ['ganada','✓','win'],
  ['perdida','✗','lose'],
  ['media_ganada','½✓','half'],
  ['media_perdida','½✗','half'],
  ['anulada','∅','']
]

function vHistorial(){
  if(!apuestas.length) return `<section><h2>Historial</h2>
    <div class="empty">El libro está vacío.<br>Registra tu primera apuesta para empezar a medir.</div></section>`
  const nombre = id => casas.find(c=>c.id===id)?.nombre ?? '—'
  return `<section><h2>Historial</h2>
    <p class="lede">Marca cada selección. La apuesta se resuelve sola: basta una fallada para perderla.
      ½ es para hándicaps de cuarto y ∅ para eventos anulados.</p>
    ${apuestas.map(a=>{
      const sel=a.selecciones||[], e=estado(sel), r=resultado(a), t=cuotaTotal(sel)
      const etq={ganada:'Ganada',perdida:'Perdida',pendiente:'Pendiente'}[e]
      return `<div class="bet ${e}">
        <div class="bet-top">
          <div class="bet-meta">${esc(a.fecha)} · ${esc(nombre(a.casa_id))} · ${etq}</div>
          <div class="bet-amt ${sig(r)}">${e==='pendiente'?money(Number(a.stake))+' →':money(r)}</div>
        </div>
        <div class="bet-meta">${sel.length>1?sel.length+' selecciones · ':''}cuota ${t.toFixed(2)}</div>
        ${sel.map(s=>`<div class="sel">
          <div class="sel-row">
            <div class="sel-txt">${esc(s.partido)}${s.mercado?`<em>${esc(s.mercado)}</em>`:''}</div>
            <span class="odd">${Number(s.cuota).toFixed(2)}</span>
          </div>
          <div class="marks">${ESTADOS.map(([v,lbl,cls])=>
            `<button class="tiny ${cls} ${s.estado===v?'on':''}" data-mark="${s.id}" data-val="${v}">${lbl}</button>`).join('')}</div>
        </div>`).join('')}
        <div style="margin-top:10px"><button class="tiny" data-borrar="${a.id}">Borrar asiento</button></div>
      </div>`
    }).join('')}
  </section>`
}

function vCasas(){
  return `<section><h2>Casas y saldos</h2>
    <p class="lede">Tu banca es la suma de todas, no bancas separadas.</p>
    ${casas.map((c,i)=>`<div class="card">
      <div class="row c2">
        <div><label for="cn${i}">Nombre</label><input id="cn${i}" value="${esc(c.nombre)}"></div>
        <div><label for="cs${i}">Saldo inicial (L)</label>
          <input id="cs${i}" inputmode="decimal" value="${esc(c.saldo_inicial)}"></div>
      </div>
      ${casas.length>1?`<button class="tiny" data-quitar="${c.id}">Quitar</button>`:''}
    </div>`).join('')}
    <button class="ghost" id="btn-add-casa">+ Añadir casa</button>
    <div style="height:12px"></div>
    <button class="act" id="btn-save-casas">Guardar saldos</button>
    <div class="flag" style="margin-top:24px">
      <strong>Sobre los picks automáticos.</strong> Este libro no genera pronósticos. Un modelo sin datos
      de alineaciones, lesiones y cuotas en vivo produciría picks que suenan seguros y no lo son —
      exactamente lo que más caro sale. La probabilidad implícita sale de la cuota, que ya es la mejor
      estimación disponible del mercado. Tu ventaja, si existe, está en discrepar de ella con criterio
      y anotarlo.
    </div>
    <div style="margin-top:20px"><button class="tiny" id="btn-salir">Cerrar sesión</button></div>
  </section>`
}

/* ---------- render ---------- */
const TABS=[['resumen','Resumen'],['nueva','Registrar'],['historial','Historial'],['casas','Casas']]

function render(){
  const app=$('app')
  if(!sesion){ app.innerHTML=vAuth(); bindAuth(); return }
  const r=resumen()
  app.innerHTML = `
    <header><h1>Libro de apuestas</h1>
      <span class="folio">${apuestas.length?apuestas.length+' asiento'+(apuestas.length>1?'s':''):'sin asientos'}</span>
    </header>
    <nav role="tablist">${TABS.map(([id,l])=>
      `<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join('')}</nav>
    ${tab==='resumen'?vResumen(r):tab==='nueva'?vNueva(r):tab==='historial'?vHistorial():vCasas()}`
  bind()
}

function bindAuth(){
  $('btn-login').onclick = async () => {
    const email=$('email').value.trim()
    if(!email) return toast('Escribe tu correo')
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}})
    toast(error ? 'Error: '+error.message : 'Enlace enviado. Revisa tu correo.')
  }
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;window.scrollTo(0,0);render()})

  if(tab==='nueva'){
    $('f-fecha').onchange=e=>form.fecha=e.target.value
    $('f-casa').onchange=e=>form.casa_id=e.target.value
    $('f-stake').oninput=e=>form.stake=e.target.value
    document.querySelectorAll('[data-leg]').forEach(inp=>{
      inp.oninput=e=>{
        legs[+inp.dataset.leg][inp.dataset.k]=e.target.value
        if(inp.dataset.k==='cuota'||inp.dataset.k==='mi_prob'){
          const pos=e.target.selectionStart; render()
          const again=$(inp.id); if(again){again.focus();try{again.setSelectionRange(pos,pos)}catch(_){}}
        }
      }
    })
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{legs.splice(+b.dataset.del,1);render()})
    $('btn-add-leg').onclick=()=>{legs.push({partido:'',mercado:'',cuota:'',mi_prob:'',cierre:''});render()}
    $('btn-guardar').onclick=guardar
  }

  if(tab==='historial'){
    document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>marcar(b.dataset.mark,b.dataset.val))
    document.querySelectorAll('[data-borrar]').forEach(b=>b.onclick=()=>borrar(b.dataset.borrar))
  }

  if(tab==='casas'){
    document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>quitarCasa(b.dataset.quitar))
    $('btn-add-casa').onclick=async()=>{
      const {error}=await sb.from('casas').insert({nombre:'Nueva casa',saldo_inicial:0})
      error?toast('Error: '+error.message):cargar()
    }
    $('btn-save-casas').onclick=guardarCasas
    $('btn-salir').onclick=async()=>{await sb.auth.signOut();location.reload()}
  }
}

/* ---------- acciones ---------- */
async function guardar(){
  const stake=Number(form.stake)
  const validas=legs.filter(l=>l.partido.trim()&&Number(l.cuota)>1)
  if(!(stake>0)) return toast('Falta el monto apostado')
  if(!validas.length) return toast('Falta al menos un partido con su cuota')

  const {data:ap,error:e1}=await sb.from('apuestas')
    .insert({fecha:form.fecha,casa_id:form.casa_id||null,stake}).select().single()
  if(e1) return toast('No se pudo guardar: '+e1.message)

  const {error:e2}=await sb.from('selecciones').insert(validas.map((l,i)=>({
    apuesta_id:ap.id, orden:i, partido:l.partido.trim(), mercado:l.mercado.trim()||null,
    cuota:Number(l.cuota),
    mi_prob:Number(l.mi_prob)>0?Number(l.mi_prob)/100:null,
    cuota_cierre:Number(l.cierre)>1?Number(l.cierre):null
  })))
  if(e2){ await sb.from('apuestas').delete().eq('id',ap.id); return toast('No se pudo guardar: '+e2.message) }

  legs=[{partido:'',mercado:'',cuota:'',mi_prob:'',cierre:''}]
  form.stake=''
  tab='historial'
  toast('Guardada')
  cargar()
}

async function marcar(id,val){
  const s=apuestas.flatMap(a=>a.selecciones||[]).find(x=>x.id===id)
  const nuevo = s && s.estado===val ? 'pendiente' : val
  const {error}=await sb.from('selecciones').update({estado:nuevo}).eq('id',id)
  error?toast('Error: '+error.message):cargar()
}
async function borrar(id){
  const {error}=await sb.from('apuestas').delete().eq('id',id)
  error?toast('Error: '+error.message):(toast('Asiento borrado'),cargar())
}
async function quitarCasa(id){
  const {error}=await sb.from('casas').delete().eq('id',id)
  error?toast('Error: '+error.message):cargar()
}
async function guardarCasas(){
  for(let i=0;i<casas.length;i++){
    const {error}=await sb.from('casas').update({
      nombre:$('cn'+i).value.trim()||'Sin nombre',
      saldo_inicial:Number($('cs'+i).value)||0
    }).eq('id',casas[i].id)
    if(error) return toast('Error: '+error.message)
  }
  toast('Saldos guardados'); cargar()
}

/* ---------- arranque ---------- */
sb.auth.onAuthStateChange((_e,s)=>{ sesion=s; s?cargar():render() })
const {data}=await sb.auth.getSession()
sesion=data.session
sesion?cargar():render()
</script>
</body>
</html>
